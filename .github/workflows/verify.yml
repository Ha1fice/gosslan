name: Verify

# =============================================================================
#  测试门禁（test gate）
#
#  ## 为什么要有这个 workflow
#
#  本仓库此前**三个 workflow 全是打包**（build / build-macos / build-android），
#  没有任何一个跑测试。也就是说：457 条前端断言 + 503 条 Rust 用例 + 93 条非空转
#  护栏，全部依赖**人工记得跑**。纪律很强，但没有门禁 —— 一次漏跑就能把回归合进 main。
#
#  真实案例（CHANGELOG 4.18.7 → 4.18.10）：BLE 分片问题连着四个版本边修边冒，
#  每一版都是人工验证过的。有这条门禁，4.18.7 的修复会当场被 4.18.9 的用例拦住。
#
#  ## 触发条件：两个都挂
#
#  `push`（任意分支）+ `pull_request`。
#
#  · 只挂 `push: [main]` 等于**合并之后**才检查，太晚；
#  · 只挂 `pull_request` 则"推上去"拿不到结果，必须先开 PR 才跑
#    （2026-09-16 实测：推了一条分支上去，API 里一个 run 都没有）；
#  · 两个都挂会让同一个分支**同时**触发两次（push 事件 + PR synchronize 事件），
#    靠下面的 concurrency 按**分支名**去重，不会真的跑两遍。
#
#  本仓库是 public ⇒ Actions 分钟数（含 macOS）免费，所以"每次推送都跑"没有成本顾虑。
#
#  ⚠️ 将来若启用 branch protection（要求 PR 上的检查通过），建议改回**只挂
#  `pull_request`**：去重是"后者取消前者"的竞态，被取消的那次在 PR 上会显示 cancelled，
#  branch protection 会因此判不通过。
#
#  ## ⚠️ 为什么是 macos-latest，而不是 ubuntu-latest
#
#  一部分代码与用例是**平台门控**的：
#
#      src-tauri/src/transport/mod.rs:15   #[cfg(all(feature = "bluetooth", target_os = "macos"))]
#      src-tauri/src/transport/mod.rs:24   #[cfg(all(feature = "bluetooth", target_os = "windows"))]
#
#  在 ubuntu 上这两块**都不编译**，对应的用例一条都不跑，而 CI 照样全绿。
#  macos-latest 是主平台（Mac 当 BLE 外设的那一半只在这里）。
#  另一半（Windows 外设）由 `rust` job 的 **windows-latest 那条腿**覆盖 ——
#  两条腿各用各的基线，因为两侧是互斥的 #[cfg]（见该 job 的注释）。
#
#  ## ⚠️ 为什么这里**故意没有** cargo fmt / clippy
#
#  第一版门禁必须**全绿**。当前 `cargo fmt --check` 有 517 处差异、`clippy` 尚未安装 ——
#  现在加进来会让每次 PR 立刻全红，结果是所有人开始用 `--no-verify` 绕过，
#  门禁一旦被绕过一次就永久失效。这两项作为**独立的技术债**单独还。
#
#  ## ⚠️ 为什么 Rust job 必须先 `npm run build`
#
#  `dist/` 在 .gitignore 里、不进版本库，而 Tauri 的 `build.rs` 要读它。全新 clone 上：
#
#      error: proc macro panicked
#        --> src/lib.rs:387:16
#        = help: message: The `frontendDist` configuration is set to `"../dist"`
#                        but this path doesn't exist
#      error: could not compile `gosslan` (lib test)
#
#  即 `cargo test` **根本编不过**。所以顺序必须是 build 前端 → 再 cargo test，
#  不能调换、也不能省。
#
#  ## 两个 job 为什么各自跑一遍 npm
#
#  GitHub 的 job 之间**不共享文件系统**，所以 Rust job 必须自己产出 dist。
#  拆成两个 job 是为了并行（macOS runner 上 cargo 编译是耗时大头）。
# =============================================================================

on:
  # 任意分支推送都跑：推上去就能拿到结果，不必先开 PR（见文件头「触发条件」）。
  push:
    branches: ["**"]
  # PR 上仍跑（合并前的关卡）。与上面的 push 事件可能同时触发，由 concurrency 去重。
  pull_request:
  workflow_dispatch:

# 同一分支去重：push 事件用 `ref_name`、PR 事件用 `head_ref`，两者都取到**分支名**，
# 所以「推分支」与「开/更新 PR」会落进同一个并发组 —— 后启动的取消先启动的，不会双跑。
# （原先用 `github.ref`：push 是 `refs/heads/X`、PR 是 `refs/pull/N/merge`，会被分成两组。）
concurrency:
  group: verify-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  #  前端：测试 + 清单守卫 + 构建
  # ---------------------------------------------------------------------------
  frontend:
    name: 前端测试 / 清单 / 构建
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 前端测试
        run: npm test

      # 守的是「新增 .test.ts 但忘了登记进 package.json」——那类文件不会被执行，
      # 而 `npm test` 依然全绿（退出码 0 的空转）。
      - name: 测试清单守卫（前端）
        run: node scripts/check-test-manifest.mjs --only frontend

      # 守的是「不变量有了例外，但只写在实现旁边、没写进 protocol-invariants.md」——
      # 那份文档是 AI 的必读清单里唯一的不变量来源，没登记的例外会被照文档误修。
      # 纯静态扫描，不需要编译，所以放在这个（快的）job 里。
      - name: 不变量例外守卫
        run: node scripts/check-invariant-exceptions.mjs

      # 结构检查（唯一行首 `## [Unreleased]` 锚点 / 标题格式 / 新在前降序）。
      # 注意用的是 `version:changelog` 而不是 `version:check`：后者的版本记账部分
      # 在攒提交期间本来就该是红的，把它拉进来会让这一步周期性误报。
      - name: CHANGELOG 结构
        run: npm run version:changelog

      # 护栏非空转验证的前端子集（约 1.5 分钟）。
      #
      # ⚠️ 这一步是**最该进 CI** 的：2026-09-16 发现「焦点可见」那条护栏因为
      # MessageComposer.vue 加了文件级逃生阀而**退化成空转**（改坏也不报）——
      # 护栏失效时不会有任何信号，只有把它跑起来才知道。此前的 92 条护栏全靠人工记得跑。
      # 全量护栏（含 Rust 用例，要重编译，10 分钟以上）留给发布前手动跑 `npm run verify -- --full`。
      - name: 护栏非空转（前端子集）
        run: python3 scripts/verify-guards.py --only frontend

      # 不只是"为 Rust job 准备 dist"：前端构建本身失败也应当拦住这次 PR。
      - name: 前端构建
        run: npm run build

  # ---------------------------------------------------------------------------
  #  Rust：单测 + 清单守卫（macOS + Windows 两条腿）
  #
  #  ⚠️ 为什么必须有 Windows 这条腿（2026-09-16）：一部分代码是 **Windows 专属** 的：
  #
  #      src-tauri/src/transport/mod.rs:24    #[cfg(all(feature = "bluetooth", target_os = "windows"))]
  #
  #  即 `bluetooth_peripheral_windows.rs`（Windows BLE **外设**角色 / WinRT GattServiceProvider，
  #  2 条用例）。在 macOS 上它**不编译**，那 2 条用例一条都不跑，而 CI 照样全绿。
  #
  #  这不是假想的风险：`transport/bluetooth.rs` 里写着「外设侧用的是同一个函数」，
  #  而实测只有 Windows 走了共享的 `att_payload_budget` —— macOS 那一侧自己抄了一份
  #  `central_payload_mtu`（硬编码 20 / 512）。这类跨平台漂移**只有在两侧都被编译时才看得见**。
  #
  #  每条腿用**自己的**基线（`test-baseline.<平台>.txt`）：macOS 外设与 Windows 外设是
  #  互斥的 `#[cfg]`，拿 macOS 的基线去比 Windows 会把 5 条平台门控用例误判成「静默跳过」。
  # ---------------------------------------------------------------------------
  rust:
    name: Rust 单测 / 清单（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Tauri 的 build.rs 需要 dist/（见文件头说明），必须在 cargo 之前。
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: 安装依赖并构建前端（cargo test 依赖 dist/）
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `--features bluetooth` 不能少：bluetooth 是**非默认** feature，
      # 漏掉它 BLE 模块根本不编译 ⇒ 那批用例连同被测代码一起消失，而 cargo test 全绿。
      # 这一点由下一步的清单守卫兜底（会比对基线名单）。
      #
      # 失败诊断走 `scripts/ci-run.sh`：它把关键行合成**一条多行 check 注解**。
      # 为什么必须这么做 —— CI 红了之后三条渠道只有一条能用：
      #   · `actions/jobs/{id}/logs` API → 匿名 403；
      #   · 浏览器日志页 → "Sign in to view logs"（**公开仓库也要登录**）；
      #   · check 注解 → ✅ 可匿名读 `/repos/O/R/check-runs/{job_id}/annotations`。
      #
      # ⚠️ Windows 上必须显式 `shell: bash`（用 Git Bash）——脚本依赖 tee/grep/tail/node。
      - name: Rust 单测
        shell: bash
        working-directory: src-tauri
        run: bash ../scripts/ci-run.sh "Rust 单测（${{ matrix.os }}）" cargo test --features bluetooth

      # 比对「基线名单 ⋈ 实际 --list」：缺名即红，专门拦"测试静默消失"。
      # 本平台没有基线时会打印与其它平台基线的**差集**（新平台引导用，见脚本注释）。
      - name: 测试清单守卫（Rust）
        shell: bash
        run: bash scripts/ci-run.sh "测试清单守卫（${{ matrix.os }}）" node scripts/check-test-manifest.mjs --only rust
